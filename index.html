<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapeamento Comportamental 300</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E30613; --red-soft:#FDE7E8; --ink:#1F2328; --muted:#5E6670; --line:#E4E6EA;
  --bg:#F6F7F9; --surface:#FFFFFF; --chip:#FFFFFF; --chip-text:#1F2328;
  --d:#E30613; --i:#F2A900; --s:#2E9E6A; --c:#2F6FD6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --red:#FF3B47; --red-soft:#3A1416; --ink:#ECEEF1; --muted:#A3AAB3; --line:#2E333A;
    --bg:#15181C; --surface:#1D2126; --chip:#23282E; --chip-text:#ECEEF1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --red:#FF3B47; --red-soft:#3A1416; --ink:#ECEEF1; --muted:#A3AAB3; --line:#2E333A;
  --bg:#15181C; --surface:#1D2126; --chip:#23282E; --chip-text:#ECEEF1; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Source Sans 3",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.logo{background:#E30613;color:#fff;font:900 26px/1 Montserrat,sans-serif;padding:14px 12px;letter-spacing:-1px}
.brand{font:600 13px/1.25 Montserrat,sans-serif;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
h1{font:800 clamp(28px,5vw,40px)/1.1 Montserrat,sans-serif;margin:0 0 14px;letter-spacing:-.5px}
h2{font:700 22px/1.2 Montserrat,sans-serif;margin:0 0 10px}
h3{font:700 16px/1.3 Montserrat,sans-serif;margin:22px 0 8px}
p{margin:0 0 12px;max-width:62ch}
.muted{color:var(--muted)}
.btn{font:700 15px Montserrat,sans-serif;border:0;border-radius:10px;padding:13px 22px;cursor:pointer;background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.progress>i{display:block;height:100%;background:var(--red);transition:width .25s}
.qnum{font:700 15px Montserrat,sans-serif;color:var(--muted);margin-bottom:18px}
.qnum b{color:var(--red)}
.label{font-weight:600;margin:18px 0 10px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.opts{grid-template-columns:repeat(2,1fr)}}
.opt{font:600 14px Montserrat,sans-serif;background:var(--chip);color:var(--chip-text);border:1.5px solid var(--line);border-radius:10px;padding:14px 8px;cursor:pointer;min-height:54px}
.opt.sel-mais{border-color:var(--red);background:var(--red-soft)}
.opt.sel-menos{border-color:var(--muted);background:var(--line)}
.opt:disabled{opacity:.35;cursor:not-allowed}
.opt{position:relative}
.opt[data-tip]:hover::after,.opt[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:220px;background:var(--ink);color:var(--surface);font:400 14px/1.35 "Source Sans 3",sans-serif;padding:8px 11px;border-radius:8px;z-index:5;pointer-events:none;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.opt[data-tip]:hover::before,.opt[data-tip]:focus-visible::before{content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink);z-index:5}
.nav{display:flex;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.err{color:var(--red);font-weight:600;min-height:1.5em;margin-top:12px}
/* resultado */
.headline{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-bottom:26px}
.code{font:900 clamp(56px,12vw,96px)/.9 Montserrat,sans-serif;letter-spacing:-3px;display:flex}
.code span{display:inline-block}
.chart{display:grid;grid-template-columns:28px repeat(4,1fr);gap:12px;align-items:end;height:250px;margin:10px 0 6px}
.axis{display:flex;flex-direction:column-reverse;justify-content:space-between;height:100%;font:600 12px Montserrat,sans-serif;color:var(--muted);text-align:right}
.col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative;background:repeating-linear-gradient(to top,transparent 0,transparent calc(100%/7 - 1px),var(--line) calc(100%/7 - 1px),var(--line) calc(100%/7))}
.col .mid{position:absolute;left:0;right:0;bottom:calc(400%/7);border-top:2px dashed var(--muted);opacity:.6}
.bar{border-radius:6px 6px 0 0;transition:height .6s cubic-bezier(.2,.8,.2,1);display:flex;justify-content:center;align-items:flex-start;padding-top:6px;color:#fff;font:800 14px Montserrat,sans-serif}
.legend{display:grid;grid-template-columns:28px repeat(4,1fr);gap:12px;text-align:center;font:700 13px Montserrat,sans-serif}
.legend small{display:block;font:400 13px "Source Sans 3",sans-serif;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
th{font:700 13px Montserrat,sans-serif;color:var(--muted)}
.scroll{overflow-x:auto}
ul{margin:0;padding-left:20px}
li{margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}.headline{grid-template-columns:1fr}}
.note{font-size:14px;color:var(--muted);margin-top:22px;border-left:3px solid var(--line);padding-left:12px}
@media (prefers-reduced-motion:reduce){.bar,.progress>i{transition:none}}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
@media (max-width:620px){.form{grid-template-columns:1fr}}
.form label{font:600 13px Montserrat,sans-serif;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.form input{font:400 16px "Source Sans 3",sans-serif;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.form input:focus-visible{outline:3px solid var(--c);outline-offset:1px}
.info{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px}
.who{display:flex;gap:14px;align-items:center}
.who b{display:block;font:700 16px Montserrat,sans-serif}
.who span,.when span{display:block;color:var(--muted)}
.when{font-size:15px;max-width:220px}
.when span{color:var(--c);margin-top:2px}
.avatar{width:64px;height:64px;border-radius:14px;background:#E30613;color:#fff;display:grid;place-items:center;font:800 22px Montserrat,sans-serif;flex:none}
.resbox{background:var(--red-soft);border-radius:18px;padding:24px 28px;margin-bottom:30px}
.resbox p{font-size:20px;margin-bottom:10px}
.resbox .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.resbox strong{font:800 clamp(26px,5vw,38px)/1.15 Montserrat,sans-serif}
#app h2{margin-top:36px}
h3.sub{font:600 20px Montserrat,sans-serif;margin-top:26px}
.resumo{border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:200px 1fr;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.rrow b{font:700 15px Montserrat,sans-serif}
@media (max-width:620px){.rrow{grid-template-columns:1fr;gap:2px}}
.boxes{margin-top:20px}
.box{border:1px solid var(--line);border-radius:12px;padding:4px 18px 8px}
.segrow{display:grid;grid-template-columns:28px repeat(4,1fr);gap:12px;text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.segrow span{grid-column:1/-1;font:600 13px Montserrat,sans-serif;color:var(--muted);text-align:left}
.segrow b{font:800 20px Montserrat,sans-serif}
.segrow b:nth-of-type(1){grid-column:2}
h3.dimh{font-size:19px;margin-top:26px}
details.calc{margin-top:30px;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.calc summary{cursor:pointer;font:700 15px Montserrat,sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">300</div>
    <div class="brand">Ecossistema<br>300 franchising</div>
  </header>
  <main id="app" class="card" aria-live="polite"></main>
</div>

<script>
// Banco de perguntas: cada opção tem a palavra e a dimensão (a ordem já vem embaralhada)

 [["Constante","S"],["Assertivo(a)","D"],["Criterioso(a)","C"],["Comunicativo(a)","I"]],

];

// Palavras da linha "menos": diferentes das da linha "mais" (ordem D, I, S, C; embaralhadas abaixo)
const MENOS_BASE = [
 [["Dinâmico(a)","D"],["Conversador(a)","I"],["Educado(a)","S"],["Sério(a)","C"]],
 [["Decisivo(a)","D"],["Interativo(a)","I"],["Plácido(a)","S"],["Cerimonioso(a)","C"]],
 [["Estrategista","D"],["Esperançoso(a)","I"],["Perseverante","S"],["Pesquisador(a)","C"]],

 [["Autoconfiante","D"],["Bom(boa) de palco","I"],["Simples","S"],["Especialista","C"]],
 [["Visionário(a)","D"],["Inventivo(a)","I"],["Resiliente","S"],["Caprichoso(a)","C"]],

 [["Contundente","D"],["Gosta de holofote","I"],["Quieto(a)","S"],["Crítico(a)","C"]],
 [["Orientado(a) a desafios","D"],["Caloroso(a)","I"],["Bom(boa) colega","S"],["Escrupuloso(a)","C"]],
 [["Gosta de vencer","D"],["Exuberante","I"],["Carinhoso(a)","S"],["Seletivo(a)","C"]],
 [["Cobrador(a) de resultados","D"],["Convence fácil","I"],["Evita conflitos","S"],["Desconfiado(a)","C"]],
 [["Sem rodeios","D"],["Piadista","I"],["Previsível","S"],["Distante","C"]],
 [["Dono(a) da situação","D"],["Positivo(a)","I"],["Pacato(a)","S"],["Sóbrio(a)","C"]],

 [["Duro(a) na negociação","D"],["Espirituoso(a)","I"],["Solícito(a)","S"],["Avaliador(a)","C"]],
 [["Desbravador(a)","D"],["Receptivo(a)","I"],["Agradecido(a)","S"],["Revisa tudo","C"]],
 [["Pulso firme","D"],["Charmoso(a)","I"],["Devotado(a)","S"],["Polido(a)","C"]],
 [["Toma a frente","D"],["Contador(a) de histórias","I"],["Suave","S"],["Contido(a)","C"]],
 [["Inconformado(a)","D"],["Mobilizador(a)","I"],["Cuidador(a)","S"],["Conservador(a)","C"]],
 [["Executor(a)","D"],["Improvisador(a)","I"],["Assíduo(a)","S"],["Silencioso(a)","C"]]
];
// embaralhamento fixo por pergunta (sempre a mesma ordem)
function embaralhar(arr,seed){const a=[...arr];let s=seed*9301+49297;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const MENOS = MENOS_BASE.map((r,i)=>embaralhar(r,i+7));

// Comportamento que cada palavra demonstra (aparece ao passar o mouse)
const TIP = {
"Constante":"Mantém o mesmo ritmo e postura no dia a dia","Assertivo(a)":"Diz o que pensa de forma clara e direta","Criterioso(a)":"Avalia com cuidado antes de aceitar algo","Comunicativo(a)":"Conversa e troca ideias com facilidade",
"Organizado(a)":"Mantém tarefas e materiais em ordem","Carismático(a)":"Atrai a atenção e a simpatia das pessoas","Objetivo(a)":"Foca no essencial e vai direto ao ponto","Acolhedor(a)":"Faz as pessoas se sentirem bem-vindas",
"Espontâneo(a)":"Age de forma natural, sem muito planejamento","Tolerante":"Aceita diferenças e erros dos outros com calma","Meticuloso(a)":"Confere cada etapa com atenção","Resoluto(a)":"Toma decisões e não volta atrás com facilidade",
"Rigoroso(a)":"Segue padrões altos de qualidade","Ambicioso(a)":"Quer crescer e alcançar metas maiores","Compreensivo(a)":"Procura entender o lado do outro","Inspirador(a)":"Anima as pessoas a darem o seu melhor",
"Ponderado(a)":"Pesa prós e contras com calma","Envolvente":"Prende a atenção das pessoas na conversa","Planejado(a)":"Organiza os passos antes de começar","Desafiador(a)":"Questiona o que está posto e propõe metas difíceis",
"Arrojado(a)":"Arrisca para conseguir mais","Racional":"Decide com base em fatos e lógica","Simpático(a)":"Trata todos de forma agradável","Conciliador(a)":"Busca acordos quando há conflito",
"Técnico(a)":"Domina o como fazer e valoriza o conhecimento","Estável":"Mantém o equilíbrio mesmo em mudanças","Proativo(a)":"Age antes de ser pedido","Expansivo(a)":"Mostra o que sente e ocupa espaço nas conversas",
"Popular":"É conhecido e querido por muita gente","Minucioso(a)":"Repara nos pequenos detalhes","Confiável":"Cumpre o que promete","Prático(a)":"Resolve do jeito mais simples e rápido",
"Atencioso(a)":"Fica atento às necessidades dos outros","Corajoso(a)":"Enfrenta situações difíceis sem recuar","Contagiante":"Passa energia e entusiasmo ao grupo","Investigativo(a)":"Busca entender a causa das coisas",
"Formal":"Segue etiqueta e protocolos","Articulado(a)":"Se expressa bem e com clareza","Destemido(a)":"Não se intimida com riscos","Sensato(a)":"Age com bom senso e equilíbrio",
"Tranquilo(a)":"Mantém a calma sob pressão","Prudente":"Evita riscos desnecessários","Sorridente":"Transmite bom humor no contato","Ágil":"Age e responde rápido",
"Criativo(a)":"Tem ideias novas e originais","Pioneiro(a)":"Gosta de ser o primeiro a fazer algo","Correto(a)":"Faz as coisas do jeito certo","Pacífico(a)":"Evita brigas e preserva a harmonia",
"Pontual":"Cumpre horários e prazos","Bom(boa) ouvinte":"Escuta com atenção antes de responder","Motivador(a)":"Incentiva os outros a seguir em frente","Focado(a) em metas":"Direciona a energia para o resultado",
"Dedicado(a)":"Se entrega ao que faz","Incisivo(a)":"Fala de forma firme e certeira","Estruturado(a)":"Organiza ideias e processos com lógica","Eloquente":"Fala bem e convence com palavras",
"Reflexivo(a)":"Pensa bastante antes de agir","Desinibido(a)":"Fica à vontade com pessoas novas","Comprometido(a)":"Assume e honra responsabilidades","Combativo(a)":"Luta pelo que quer e não foge de disputas",
"Engraçado(a)":"Faz os outros rirem","Cordial":"Trata todos com educação e gentileza","Empreendedor(a)":"Cria oportunidades e põe ideias em prática","Observador(a)":"Nota o que os outros não percebem",

"Apoiador(a)":"Ajuda e sustenta os colegas","Coerente":"Age de acordo com o que diz","Bom(boa) de conversa":"Mantém qualquer papo fluindo","Enfático(a)":"Reforça seus pontos com intensidade",
"Influente":"Consegue mudar a opinião dos outros","Pragmático(a)":"Prioriza o que funciona na prática","Cético(a)":"Só acredita com provas","Empático(a)":"Sente e entende o que o outro sente",
"Precavido(a)":"Se prepara para o que pode dar errado","Despretensioso(a)":"Não busca destaque para si","Tenaz":"Insiste até conseguir","Encorajador(a)":"Dá confiança para os outros tentarem",

  document.getElementById("prev").onclick=()=>{atual--;render()};
  document.getElementById("next").onclick=()=>{
    if(r.mais===null||r.menos===null){document.getElementById("err").textContent="Escolha uma palavra em cada linha para continuar.";return}
    atual++;render();window.scrollTo(0,0);
  };
}

function calcular(){
  const m={D:0,I:0,S:0,C:0}, l={D:0,I:0,S:0,C:0};
  resp.forEach((r,i)=>{m[Q[i][r.mais][1]]++; l[MENOS[i][r.menos][1]]++;});
  const res={};
  ORDEM.forEach(k=>{const d=m[k]-l[k];res[k]={mais:m[k],menos:l[k],dif:d,seg:segmento(d)}});
  const rank=[...ORDEM].sort((a,b)=>res[b].seg-res[a].seg||res[b].dif-res[a].dif||ORDEM.indexOf(a)-ORDEM.indexOf(b));
  const altas=rank.filter(k=>res[k].seg>=5).slice(0,2);
  return{res,principal:rank[0],altas,perfil:PERFIS[altas.join("-")]};
}

function telaResultado(){

  app.innerHTML=`

        <div><b>${esc(pessoa.nome)}</b><span>${esc(pessoa.cargo)}</span><span>${esc(pessoa.area)}</span></div>
      </div>
      <div class="when">Data de realização do mapeamento:<span>${data}</span></div>
    </div>

    <div class="resbox">
      <p>O resultado do mapeamento é</p>
      <div class="two"><strong>Perfil<br>${perfil}</strong><strong>Dimensão<br>${P.adj}</strong></div>
    </div>

    <h2>Sobre o perfil: ${perfil}</h2>
    ${sobrePerfil}

    <h3 class="sub">Resumo do perfil</h3>
    <div class="resumo">${ROTULOS.map(([k,t])=>`<div class="rrow"><b>${t}</b><span>${P.resumo[k]}</span></div>`).join("")}</div>

    <h2>Perfil no local de trabalho</h2>
    ${P.trabalho.map(([t,x])=>`<h3>${t}</h3><p>${x}</p>`).join("")}
    <div class="grid2 boxes">
      <div class="box"><h3>Motivadores</h3><p>${P.motiva}</p></div>
      <div class="box"><h3>Estressores</h3><p>${P.estressa}</p></div>
    </div>

    <h2>Sobre a dimensão: ${P.adj}</h2>
    ${P.sobre.map(x=>`<p>${x}</p>`).join("")}

    <h2>Pontos para desenvolver</h2>
    <p>Para apoiar seu desenvolvimento comportamental, sugerimos três habilidades.</p>
    ${P.pontos.map(([t,x,b])=>`<h3>${t}</h3><p>${x}</p><ul>${b.map(i=>`<li>${i}</li>`).join("")}</ul>`).join("")}

    <h2>Gráfico DISC</h2>
    <div class="chart" role="img" aria-label="Gráfico DISC">
      <div class="axis">${[1,2,3,4,5,6,7].map(n=>`<span>${n}</span>`).join("")}</div>
      ${ORDEM.map(k=>`<div class="col"><div class="mid"></div><div class="bar" data-h="${res[k].seg/7*100}" style="height:0;background:${DIM[k].cor}">${Math.round(res[k].seg/7*100)}%</div></div>`).join("")}
    </div>
    <div class="legend"><span></span>${ORDEM.map(k=>`<span>${k}<small>${DIM[k].nome}</small></span>`).join("")}</div>
    <div class="segrow"><span>Nível de intensidade</span>${ORDEM.map(k=>`<b>${res[k].seg}</b>`).join("")}</div>

    <h2>Dimensões e suas intensidades</h2>
    ${ORDEM.map(k=>`<h3 class="dimh"><span style="color:${DIM[k].cor}">${Math.round(res[k].seg/7*100)}%</span> ${DIM[k].nome}</h3>
      ${DIM[k].int[faixa(res[k].seg)].map(([a,t])=>`<p><b>${a}:</b> ${t}</p>`).join("")}`).join("")}

    <details class="calc"><summary>Como o cálculo chegou aqui</summary>
    <div class="scroll"><table>
      <thead><tr><th>Dimensão</th><th>Mais</th><th>Menos</th><th>Diferença</th><th>Nota (1–7)</th></tr></thead>
      <tbody>${ORDEM.map(k=>`<tr><td>${k} — ${DIM[k].nome}</td><td>${res[k].mais}</td><td>${res[k].menos}</td><td>${res[k].dif>0?"+":""}${res[k].dif}</td><td><b>${res[k].seg}</b></td></tr>`).join("")}</tbody>
    </table></div></details>

    <p class="note">Protótipo para validação interna. Textos, nomes de perfil e faixas de nota são exemplos e devem ser revisados pelo RH antes do uso.</p>
    <div class="row">
      <button class="btn" id="again">Refazer o mapeamento</button>
      <button class="btn ghost" id="demo2">Gerar outro exemplo aleatório</button>
    </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll(".bar").forEach(b=>b.style.height=b.dataset.h+"%")));
  document.getElementById("again").onclick=()=>{resp=Q.map(()=>({mais:null,menos:null}));atual=-1;render();window.scrollTo(0,0)};
  document.getElementById("demo2").onclick=()=>{resp=aleatorio();render();window.scrollTo(0,0)};
}

render();
</script>
